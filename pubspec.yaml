name: sunumarket
description: "SunuMarket — marketplace mobile dédiée au Sénégal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Réseau / API
  dio: ^5.7.0

  # Gestion d'état
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # Stockage sécurisé du jeton d'authentification
  flutter_secure_storage: ^9.2.2

  # Sélection de photos (annonces, avatar, pièces jointes)
  image_picker: ^1.1.2

  # Affichage d'images réseau avec cache
  cached_network_image: ^3.4.1

  # Formatage devise/dates (FCFA, dates relatives en français)
  intl: ^0.19.0

  # Ouverture de l'application téléphone/URL de paiement externe
  url_launcher: ^6.3.1

  # État vide/chargement/erreur réutilisables
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
